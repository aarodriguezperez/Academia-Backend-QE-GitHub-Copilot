# Configuracion global de JUnit para ESTE proyecto.
#
# JUnit lee este archivo automaticamente si esta en el classpath de test
# (src/test/resources). No hay que registrarlo en ninguna parte.
#
# Aqui esta comentado casi todo a proposito: la idea es que veas que se
# puede tocar. Descomenta y corre `mvn test` para ver el efecto.

# --- Nombres legibles sin escribir @DisplayName en cada metodo ----------
# Convierte  void un_curso_lleno_rechaza()  en  "un curso lleno rechaza".
# junit.jupiter.displayname.generator.default = \
#     org.junit.jupiter.api.DisplayNameGenerator$ReplaceUnderscores

# --- Paralelismo -------------------------------------------------------
# Reparte los tests entre varios hilos. Puede bajar mucho el tiempo de la
# suite, y saca a la luz los tests que compartian estado sin saberlo.
# junit.jupiter.execution.parallel.enabled = true
# junit.jupiter.execution.parallel.mode.default = concurrent

# --- Ciclo de vida por defecto ----------------------------------------
# per_method (el de fabrica) = una instancia nueva por test.
# per_class  = una sola instancia por clase. Ver OrdenTest y el aviso.
# junit.jupiter.testinstance.lifecycle.default = per_method

# --- Timeout global ----------------------------------------------------
# Red de seguridad contra el test que se cuelga y para el build entero.
junit.jupiter.execution.timeout.testable.method.default = 30 s
